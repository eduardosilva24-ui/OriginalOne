<!DOCTYPE html>
<html>
<head>
<base target="_top">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#40466d;color:white;font-family:'Poppins',sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px;}
.container{max-width:1200px;width:100%;height:100vh;display:flex;flex-direction:column;padding:20px;background:linear-gradient(135deg,#4a5276,#2b304b);border-radius:15px;box-shadow:0 8px 20px rgba(0,0,0,0.4);}
.title{font-weight:300;font-size:2.7rem;text-align:center;margin-bottom:30px;letter-spacing:2px;text-shadow:0 0 8px rgba(255,255,255,0.3);}
.main-content{flex:1;display:grid;grid-template-columns:1fr auto 1fr;gap:30px;align-items:start;}
.input-table{border:2px solid #fff;border-radius:10px;background:rgba(255,255,255,0.07);box-shadow:inset 0 0 10px rgba(255,255,255,0.1);max-height:450px;overflow-y:auto;}
table{width:100%;border-collapse:collapse;table-layout:fixed;}
th,td{border:1px solid rgba(255,255,255,0.2);padding:10px 8px;height:42px;font-weight:300;text-align:center;word-wrap:break-word;}
th{background:rgba(255,255,255,0.15);font-weight:600;letter-spacing:1px;text-transform:uppercase;}
.objectives-cell { text-align: left; white-space: normal; font-size: 0.85rem; line-height: 1.2; padding: 10px 12px; }
.editable-cell{width:100%;height:100%;background:transparent;border:none;color:white;font-family:inherit;font-size:0.95rem;outline:none;cursor:text;padding:3px 5px;user-select:text;}
.editable-cell:empty:before{content:attr(data-placeholder);color:rgba(255,255,255,0.3);pointer-events:none;user-select:none;}
.button-container{display:flex;flex-direction:column;align-items:center;gap:15px;padding:0 10px;min-width:180px;}
.generate-btn{background:#ff4b4b;color:white;border:none;padding:14px 40px;border-radius:30px;font-size:1.15rem;cursor:pointer;font-weight:600;box-shadow:0 4px 10px rgba(255,75,75,0.6);transition:all .3s ease;width:100%;max-width:220px;}
.generate-btn:hover,.generate-btn:focus{background:#e03f3f;transform:scale(1.07);box-shadow:0 6px 18px rgba(224,63,63,0.8);outline:none;}
.logo{width:120px;filter:drop-shadow(0 0 6px rgba(255,255,255,0.25));user-select:none;}
.horario-container{margin-top:12px;width:100%;max-width:220px;display:flex;flex-direction:column;align-items:center;gap:6px;}
label[for="horario"]{font-weight:600;font-size:1rem;letter-spacing:0.7px;color:#ffdede;text-shadow:0 0 3px rgba(255,75,75,0.7);user-select:none;}
input[type="time"]{width:100%;padding:8px 12px;border-radius:25px;border:2px solid #ff4b4b;background:rgba(255,75,75,0.15);color:white;font-size:1rem;font-weight:500;font-family:'Poppins',sans-serif;box-shadow:0 2px 8px rgba(255,75,75,0.3);transition:border-color .3s ease,background-color .3s ease;cursor:pointer;text-align:center;}
input[type="time"]:focus{border-color:#ff1f1f;background:rgba(255,31,31,0.35);outline:none;box-shadow:0 0 10px #ff1f1f;}
#output{width:100%;font-family:monospace;padding:12px 14px;margin:10px 0;border-radius:12px;border:none;resize:vertical;min-height:120px;background:rgba(255,255,255,0.1);color:white;box-shadow:inset 0 0 8px rgba(255,255,255,0.15);}
#output:focus{outline:none;background:rgba(255,255,255,0.2);}
label[for="output"]{font-size:0.9rem;user-select:none;color:#f0eaeacc;font-weight:500;}
.footer{font-size:9px;color:rgba(255,255,255,0.5);text-align:left;padding:5px 10px;user-select:none;margin-top:15px;}
.input-table::-webkit-scrollbar{width:8px;height:8px;}
.input-table::-webkit-scrollbar-thumb{background:rgba(255,75,75,0.5);border-radius:10px;}
.input-table::-webkit-scrollbar-track{background:transparent;}
#outputBody tr td:nth-child(4), #outputBody tr td:nth-child(5) { width: 40%; min-width: 250px;}
#outputBody tr td:nth-child(3), #outputBody tr td:nth-child(4) { text-align: center;}
#outputBody tr td:nth-child(5) > div { text-align: left; font-size: 0.85rem; line-height: 1.3;}
.hidden-objectives { display: none; }
</style>
</head>
<body>

<div class="container">

<h1 class="title">Class Planning Program</h1>

<div class="main-content">

<div class="input-table">
<table>
<thead><tr><th>NAME</th><th>BOOK</th><th>LESSON</th></tr></thead>
<tbody id="inputBody"></tbody>
</table>
</div>

<div class="button-container">
<button class="generate-btn" onclick="processData()">Gerar Aula</button>
<button class="generate-btn" onclick="toggleObjectivesColumn()">Mostrar/Ocultar Learning Objectives</button>

<img src="https://cdn.wizard.com.br/wp-content/uploads/2019/10/01155611/logo-aguia-wizard-by-pearson-idiomas.png" class="logo" alt="Wizard logo">

<div class="horario-container">
<label for="horario">Horário da aula</label>
<input type="time" id="horario">
</div>
</div>

<div class="input-table">
<table>
<thead>
<tr>
<th>NAME</th>
<th>BOOK</th>
<th>LESSON</th>
<th>CHECKING TIME</th>
<th>LEARNING OBJECTIVES</th>
</tr>
</thead>
<tbody id="outputBody"></tbody>
</table>
</div>

</div>

<div style="margin-top:20px;">
<label for="output">Copiar resultado para Excel:</label>
<textarea id="output" readonly rows="5"></textarea>
<button onclick="copiarResultado()" class="generate-btn" style="padding:8px 20px;font-size:1rem;">Copiar para Excel</button>
</div>

<div class="footer">Eduardo Moretti</div>

</div>

<script>
let objectivesVisible = true;

function initTables() {
    const inB = document.getElementById('inputBody'), outB = document.getElementById('outputBody');
    for(let i=0;i<10;i++){
        const trIn = document.createElement('tr');
        for(let j=0;j<3;j++){
            const td = document.createElement('td'), div = document.createElement('div');
            div.className='editable-cell'; div.contentEditable = true;
            div.setAttribute('data-placeholder', j===0?'Name':j===1?'Book':'Lesson');
            td.appendChild(div); trIn.appendChild(td);
        }
        inB.appendChild(trIn);

        const trOut = document.createElement('tr');
        for(let j=0;j<5;j++){
            const td = document.createElement('td'), div = document.createElement('div');
            div.className='editable-cell'; div.contentEditable = false;
            if(j===4) td.classList.add('objectives-cell'); 
            td.appendChild(div); trOut.appendChild(td);
        }
        outB.appendChild(trOut);
    }
}

function handlePaste(e) {
    e.preventDefault();
    const text = (e.clipboardData||window.clipboardData).getData('text'),
    rows = text.split('\n').filter(r=>r.trim()),
    cells= document.querySelectorAll('#inputBody .editable-cell');
    let idx=0;
    rows.forEach(r=>r.split('\t').forEach(col=>{
        if(idx<cells.length) cells[idx].textContent = col.trim();
        idx++;
    }));
}

function processData() {
    const horario = document.getElementById('horario').value;
    const lines = Array.from(document.querySelectorAll('#inputBody tr'))
        .map(tr=>{ const c = tr.querySelectorAll('.editable-cell');
        return [c[0].textContent.trim(),c[1].textContent.trim(),c[2].textContent.trim()].join('\t'); })
        .filter(l=>l.split('\t').some(x=>x));
    google.script.run.withSuccessHandler(fillOutput).processarTexto(lines.join('\n'), horario, objectivesVisible);
}

function fillOutput(res) {
    const textarea = document.getElementById('output');
    const outTbl = document.getElementById('outputBody');
    const trimmed = res.trim();
    textarea.value = trimmed;
    const lines = trimmed.split('\n');
    outTbl.innerHTML = '';
    lines.forEach((line, idx)=>{
        const l = line.trim();
        if(!l) return;
        const parts = l.split('\t');
        const tr = document.createElement('tr');
        parts.forEach((text, partIdx)=>{
            const td = document.createElement('td');
            const div = document.createElement('div');
            div.className='editable-cell'; div.contentEditable = false; div.textContent = text;
            if(partIdx===4) td.classList.add('objectives-cell');
            if(partIdx===4 && !objectivesVisible) td.classList.add('hidden-objectives');
            td.appendChild(div); tr.appendChild(td);
        });
        outTbl.appendChild(tr);
    });
}

function toggleObjectivesColumn() {
    objectivesVisible = !objectivesVisible;
    const rows = document.querySelectorAll('#outputBody tr');
    rows.forEach(tr=>{
        const tds = tr.querySelectorAll('td');
        if(tds.length >= 5){ // garante que existe a coluna 5 (LEARNING OBJECTIVES)
            tds[4].classList.toggle('hidden-objectives', !objectivesVisible);
        }
    });
}

function copiarResultado() {
    const out=document.getElementById('output');
    out.select(); document.execCommand('copy');
    alert('Copiado! Agora cole no Excel.');
}

document.addEventListener('DOMContentLoaded',()=>{
    initTables();
    document.getElementById('inputBody').addEventListener('paste', handlePaste);
});
</script>

</body>
</html>
